<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Kamotas Chapati — fresh chapati and delicious meals in Dodoma."
    >

    <meta
        name="theme-color"
        content="#17120e"
    >

    <title>Kamotas Chapati | Fresh Food Restaurant</title>


    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >


    <!-- =====================================================
         GLOBAL STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/global.css"
    >

    <!--
        Page-specific CSS is loaded dynamically
        by js/main.js
    -->

</head>


<body>

    <!-- =====================================================
         SITE HEADER
    ====================================================== -->

    <header class="site-header">

        <nav
            class="navbar container"
            aria-label="Main navigation"
        >

            <!-- BRAND -->

            <a
                href="#home"
                class="brand"
                data-page="home"
                aria-label="Kamotas Chapati home"
            >

                <span class="brand-logo">

                    <img
                        src="./assets/images/logo.png"
                        alt="Kamotas Chapati logo"
                        width="48"
                        height="48"
                    >

                </span>

                <span class="brand-text">

                    <strong>Kamotas</strong>

                    <small>Chapati</small>

                </span>

            </a>


            <!-- MOBILE MENU BUTTON -->

            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="nav-links"
            >

                <i
                    class="fa-solid fa-bars"
                    aria-hidden="true"
                ></i>

            </button>


            <!-- NAVIGATION -->

            <ul
                class="nav-links"
                id="nav-links"
            >

                <li>
                    <a
                        href="#home"
                        data-page="home"
                    >
                        Home
                    </a>
                </li>

                <li>
                    <a
                        href="#about"
                        data-page="about"
                    >
                        About
                    </a>
                </li>

                <li>
                    <a
                        href="#menu"
                        data-page="menu"
                    >
                        Menu
                    </a>
                </li>

                <li>
                    <a
                        href="#gallery"
                        data-page="gallery"
                    >
                        Gallery
                    </a>
                </li>

                <li>
                    <a
                        href="#contact"
                        data-page="contact"
                    >
                        Contact
                    </a>
                </li>

            </ul>


            <!-- ORDER CTA -->

            <a
                href="#menu"
                class="nav-order-btn"
                data-page="menu"
            >

                <i
                    class="fa-solid fa-bag-shopping"
                    aria-hidden="true"
                ></i>

                <span>Order Now</span>

            </a>

        </nav>

    </header>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <main
        id="app"
        tabindex="-1"
    >

        <!--
            Main page content is injected here
            by js/main.js
        -->

        <section
            class="page-loading"
            aria-live="polite"
            aria-label="Loading page"
        >

            <div
                class="loading-spinner"
                aria-hidden="true"
            ></div>

            <p>Loading Kamotas...</p>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="container footer-inner">


            <!-- FOOTER BRAND -->

            <div class="footer-brand">

                <img
                    src="./assets/images/logo.png"
                    alt="Kamotas Chapati"
                    width="42"
                    height="42"
                >

                <div>

                    <strong>Kamotas Chapati</strong>

                    <span>
                        Fresh food. Great taste.
                    </span>

                </div>

            </div>


            <!-- FOOTER CONTACT -->

            <div
                class="footer-contact"
                aria-label="Contact information"
            >

                <a href="tel:+255782722871">

                    <i
                        class="fa-solid fa-phone"
                        aria-hidden="true"
                    ></i>

                    <span>+255 782 722 871</span>

                </a>


                <a
                    href="https://wa.me/255782722871"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <i
                        class="fa-brands fa-whatsapp"
                        aria-hidden="true"
                    ></i>

                    <span>WhatsApp</span>

                </a>

            </div>


            <!-- COPYRIGHT -->

            <p class="footer-copy">

                ©
                <span id="footer-year"></span>

                Kamotas Chapati.
                All Rights Reserved.

            </p>

        </div>

    </footer>


    <!-- =====================================================
         THIRD-PARTY LIBRARIES
    ====================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    ></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    ></script>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
